<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axiom Learning Board</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%236ee7d0'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23060b14'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved whiteboard theme before React and styles load so the
      // shell and embedded scene never paint with different backgrounds.
      try {
        document.documentElement.dataset.axiomTheme =
          localStorage.getItem('axiom.scene.theme') === 'light' ? 'light' : 'dark'
      } catch {
        document.documentElement.dataset.axiomTheme = 'dark'
      }
    </script>
    <style>
      /* 防止 FOUC（闪烁未样式内容） */
      html,
      body { margin: 0; padding: 0; height: 100%; }
      html[data-axiom-theme="light"],
      html[data-axiom-theme="light"] body { background: #ffffff; color-scheme: light; }
      html[data-axiom-theme="dark"],
      html[data-axiom-theme="dark"] body { background: #0b0f13; color-scheme: dark; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
